general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && /home/barab/brice/scripts/auto-brightness.sh  # turn on display and re-adjust brightness from IIO sensor.
}

listener {
    timeout = 75                                  # 1m15s: brief pre-lock dim warning.
    on-timeout = brightnessctl -s --class=backlight set 10%
    on-resume = brightnessctl -r --class=backlight
}

listener {
    timeout = 75                                  # turn off Framework keyboard backlight when idle.
    on-timeout = brightnessctl -sd 'framework_laptop::kbd_backlight' set 0 2>/dev/null || true
    on-resume = brightnessctl -rd 'framework_laptop::kbd_backlight' 2>/dev/null || true
}

listener {
    timeout = 100
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 150                                 # 2.5min.
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'        # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 300                                 # 5min
    on-timeout = systemctl suspend-then-hibernate || systemctl suspend # suspend pc
}
